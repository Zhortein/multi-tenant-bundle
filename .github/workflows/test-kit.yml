name: Compatibility

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  postgresql:
    name: PostgreSQL ${{ matrix.postgresql }} / required security recipes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: multi_tenant_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U test_user -d multi_tenant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_NAME: multi_tenant_test
      TEST_DATABASE_USER: test_user
      TEST_DATABASE_PASSWORD: test_password
      TEST_DATABASE_APP_USER: rls_test_app
      TEST_DATABASE_APP_PASSWORD: rls_test_password
      TEST_DATABASE_REQUIRED: 1
      TEST_DATABASE_SERVER_VERSION: ${{ matrix.postgresql }}
      TEST_KERNEL_DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/multi_tenant_kernel_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.9'
          extensions: pdo_pgsql
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Provision isolated functional databases
        run: PGPASSWORD="$TEST_DATABASE_PASSWORD" psql -h "$TEST_DATABASE_HOST" -p "$TEST_DATABASE_PORT" -U "$TEST_DATABASE_USER" -d "$TEST_DATABASE_NAME" -f tests/sql/provision-databases.sql

      - name: Run shared-database, CLI, HTTP, and Messenger recipes on PostgreSQL
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --exclude-group rls --no-coverage

      - name: Run RLS and multi-database recipes on PostgreSQL
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --group rls --no-coverage

  quality:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Validate documentation
        run: php tests/validate-documentation.php

      - name: Check coding style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  minimal-install:
    name: Minimal production install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Resolve production dependencies only
        run: composer update --no-dev --prefer-dist --no-progress --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit production dependencies
        run: composer audit --no-interaction --abandoned=report

      - name: Compile without optional integrations
        run: php tests/minimal-install.php

  consumer-application:
    name: Consumer / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Symfony 7.4
            php: "8.3"
            symfony: "~7.4.0"
          - name: Symfony 8.0
            php: "8.4"
            symfony: "~8.0.0"
          - name: Symfony 8.1
            php: "8.5.9"
            symfony: "~8.1.0"
    defaults:
      run:
        working-directory: /tmp/consumer
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare external consumer directory
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "/tmp/consumer"
          cp -R tests/ConsumerApp/. "/tmp/consumer/"
          composer --working-dir="/tmp/consumer" config --json repositories.bundle "{\"type\":\"path\",\"url\":\"${GITHUB_WORKSPACE}\",\"options\":{\"symlink\":false}}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Select the Symfony branch
        run: >-
          composer require --no-update
          "symfony/cache:${{ matrix.symfony }}"
          "symfony/config:${{ matrix.symfony }}"
          "symfony/console:${{ matrix.symfony }}"
          "symfony/dependency-injection:${{ matrix.symfony }}"
          "symfony/doctrine-messenger:${{ matrix.symfony }}"
          "symfony/event-dispatcher:${{ matrix.symfony }}"
          "symfony/filesystem:${{ matrix.symfony }}"
          "symfony/finder:${{ matrix.symfony }}"
          "symfony/framework-bundle:${{ matrix.symfony }}"
          "symfony/http-foundation:${{ matrix.symfony }}"
          "symfony/http-kernel:${{ matrix.symfony }}"
          "symfony/mailer:${{ matrix.symfony }}"
          "symfony/messenger:${{ matrix.symfony }}"
          "symfony/scheduler:${{ matrix.symfony }}"
          "symfony/validator:${{ matrix.symfony }}"

      - name: Select compatible test dependencies
        run: >-
          composer require --dev --no-update
          "phpunit/phpunit:^12.2"
          "symfony/browser-kit:${{ matrix.symfony }}"
          "symfony/dom-crawler:${{ matrix.symfony }}"
          "symfony/security-bundle:${{ matrix.symfony }}"

      - name: Install the bundle as an external dependency
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Validate shared database container
        run: |
          php bin/console lint:container
          php bin/validate.php
        env:
          DATABASE_STRATEGY: shared_db

      - name: Validate container with optional cache decorator disabled
        run: php bin/console lint:container
        env:
          APP_ENV: test_cache_disabled
          CACHE_DECORATOR_ENABLED: 0

      - name: Validate public test kit with shared database strategy
        run: vendor/bin/phpunit --no-coverage
        env:
          DATABASE_STRATEGY: shared_db

      - name: Validate multi-database container
        run: |
          php bin/console lint:container
          php bin/validate.php
        env:
          DATABASE_STRATEGY: multi_db

      - name: Validate public test kit with multi-database strategy
        run: vendor/bin/phpunit --no-coverage
        env:
          DATABASE_STRATEGY: multi_db

  doctrine-migrations-3:
    name: DoctrineMigrationsBundle ${{ matrix.migrations_bundle }} / DBAL ${{ matrix.dbal }} / PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - migrations_bundle: '3.4.0'
            migrations: '3.7.4'
            php: '8.3'
            orm: '3.5.*'
            dbal: '3.8.7'
            doctrine_bundle: '2.19.0'
            postgresql: '16'
          - migrations_bundle: '3.4.0'
            migrations: '3.7.4'
            php: '8.3'
            orm: '3.5.*'
            dbal: '3.8.7'
            doctrine_bundle: '2.19.0'
            postgresql: '18'
          - migrations_bundle: '3.7.0'
            migrations: '3.9.7'
            php: '8.4'
            orm: '3.6.8'
            dbal: '4.4.4'
            doctrine_bundle: '3.3.1'
            postgresql: '16'
          - migrations_bundle: '3.7.0'
            migrations: '3.9.7'
            php: '8.4'
            orm: '3.6.8'
            dbal: '4.4.4'
            doctrine_bundle: '3.3.1'
            postgresql: '18'
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: consumer
          POSTGRES_USER: consumer
          POSTGRES_PASSWORD: consumer
        options: >-
          --health-cmd "pg_isready -U consumer -d consumer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: /tmp/consumer
    env:
      DATABASE_URL: postgresql://consumer:consumer@127.0.0.1:5432/consumer?serverVersion=${{ matrix.postgresql }}
      TENANT_DATABASE_A_URL: postgresql://consumer:consumer@127.0.0.1:5432/consumer_tenant_a?serverVersion=${{ matrix.postgresql }}
      TENANT_DATABASE_B_URL: postgresql://consumer:consumer@127.0.0.1:5432/consumer_tenant_b?serverVersion=${{ matrix.postgresql }}
      DATABASE_STRATEGY: shared_db
      EXACT_CONSUMER: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare external consumer directory
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/consumer
          cp -R tests/ConsumerApp/. /tmp/consumer/
          composer --working-dir=/tmp/consumer config --json repositories.bundle "{\"type\":\"path\",\"url\":\"${GITHUB_WORKSPACE}\",\"options\":{\"symlink\":false}}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql
          coverage: none

      - name: Select Doctrine Migrations Bundle 3 compatibility graph
        run: >-
          composer require --no-update
          "symfony/framework-bundle:7.4.15"
          "doctrine/orm:${{ matrix.orm }}"
          "doctrine/dbal:${{ matrix.dbal }}"
          "doctrine/doctrine-bundle:${{ matrix.doctrine_bundle }}"
          "doctrine/doctrine-migrations-bundle:${{ matrix.migrations_bundle }}"
          "doctrine/migrations:${{ matrix.migrations }}"

      - name: Install the checkout as an external dependency
        run: composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

      - name: Assert selected Doctrine migration graph
        run: php bin/assert-migration-graph.php "${{ matrix.migrations_bundle }}" "${{ matrix.migrations }}" "${{ matrix.dbal }}"

      - name: Validate container and Doctrine metadata
        run: |
          php bin/validate.php
          php bin/console doctrine:schema:validate --skip-sync

      - name: Exercise tenant:migrate dry-run, execution, and idempotence
        run: sh bin/test-tenant-migrate.sh

      - name: Exercise migration up, down, and up
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:migrations:migrate prev --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run consumer tests
        run: vendor/bin/phpunit --no-coverage

  services-locaux-consumer:
    name: Consumer / Services Locaux exact graph / PostgreSQL ${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: consumer
          POSTGRES_USER: consumer
          POSTGRES_PASSWORD: consumer
        options: >-
          --health-cmd "pg_isready -U consumer -d consumer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: /tmp/consumer
    env:
      DATABASE_URL: postgresql://consumer:consumer@127.0.0.1:5432/consumer?serverVersion=${{ matrix.postgresql }}
      TENANT_DATABASE_A_URL: postgresql://consumer:consumer@127.0.0.1:5432/consumer_tenant_a?serverVersion=${{ matrix.postgresql }}
      TENANT_DATABASE_B_URL: postgresql://consumer:consumer@127.0.0.1:5432/consumer_tenant_b?serverVersion=${{ matrix.postgresql }}
      DATABASE_STRATEGY: shared_db
      EXACT_CONSUMER: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare external consumer directory
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/consumer
          cp -R tests/ConsumerApp/. /tmp/consumer/
          composer --working-dir=/tmp/consumer config --json repositories.bundle "{\"type\":\"path\",\"url\":\"${GITHUB_WORKSPACE}\",\"options\":{\"symlink\":false}}"
          composer --working-dir=/tmp/consumer config platform.php 8.5.9

      - name: Build the exact PHP 8.5.9 consumer runtime
        working-directory: ${{ github.workspace }}
        run: docker build --tag services-locaux-consumer --file tests/ConsumerApp/Dockerfile tests/ConsumerApp

      - name: Select the exact root dependency graph
        run: >-
          docker run --rm --volume /tmp/consumer:/consumer services-locaux-consumer
          composer require --no-update
          "symfony/cache:8.1.5"
          "php:8.5.9"
          "symfony/config:8.1.5"
          "symfony/console:8.1.5"
          "symfony/dependency-injection:8.1.5"
          "symfony/doctrine-messenger:8.1.4"
          "symfony/event-dispatcher:8.1.5"
          "symfony/filesystem:8.1.5"
          "symfony/finder:8.1.5"
          "symfony/framework-bundle:8.1.5"
          "symfony/http-foundation:8.1.5"
          "symfony/http-kernel:8.1.5"
          "symfony/mailer:8.1.5"
          "symfony/messenger:8.1.5"
          "symfony/scheduler:8.1.5"
          "symfony/validator:8.1.6"
          "doctrine/orm:3.6.8"
          "doctrine/dbal:4.4.4"
          "doctrine/doctrine-bundle:3.3.1"
          "doctrine/doctrine-migrations-bundle:4.0.1"

      - name: Select the exact optional SecurityBundle version
        run: >-
          docker run --rm --volume /tmp/consumer:/consumer services-locaux-consumer
          composer require --dev --no-update "symfony/security-bundle:8.1.6"

      - name: Install the checkout as an external dependency
        run: >-
          docker run --rm --volume /tmp/consumer:/consumer
          --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}:ro"
          services-locaux-consumer
          composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

      - name: Assert exact installed versions
        run: docker run --rm --volume /tmp/consumer:/consumer services-locaux-consumer php bin/assert-exact-versions.php

      - name: Validate container and Doctrine metadata
        run: |
          docker run --rm --network host --volume /tmp/consumer:/consumer --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer php bin/console lint:container
          docker run --rm --network host --volume /tmp/consumer:/consumer --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer php bin/validate.php
          docker run --rm --network host --volume /tmp/consumer:/consumer --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer php bin/console doctrine:schema:validate --skip-sync

      - name: Exercise tenant:migrate dry-run, execution, and idempotence
        run: >-
          docker run --rm --network host --volume /tmp/consumer:/consumer
          --env DATABASE_URL --env TENANT_DATABASE_A_URL --env TENANT_DATABASE_B_URL
          --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer
          sh bin/test-tenant-migrate.sh

      - name: Exercise migration up, down, and up
        run: |
          docker run --rm --network host --volume /tmp/consumer:/consumer --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer php bin/console doctrine:migrations:migrate --no-interaction
          docker run --rm --network host --volume /tmp/consumer:/consumer --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer php bin/console doctrine:migrations:migrate prev --no-interaction
          docker run --rm --network host --volume /tmp/consumer:/consumer --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer php bin/console doctrine:migrations:migrate --no-interaction

      - name: Prove fail-closed consumer boundaries
        run: >-
          docker run --rm --network host --volume /tmp/consumer:/consumer
          --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer
          php vendor/bin/phpunit --no-coverage

  candidate-archive:
    name: Candidate archive / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DoctrineMigrationsBundle 3.4 / DBAL 3.8 / PostgreSQL 16
            php: '8.3'
            symfony: '~7.4.0'
            orm: '3.5.*'
            dbal: '3.8.7'
            doctrine_bundle: '2.19.0'
            migrations_bundle: '3.4.0'
            migrations: '3.7.4'
            postgresql: '16'
          - name: DoctrineMigrationsBundle 4.0.1 / DBAL 4.4 / PostgreSQL 18
            php: '8.5.9'
            symfony: '~8.1.0'
            orm: '3.6.8'
            dbal: '4.4.4'
            doctrine_bundle: '3.3.1'
            migrations_bundle: '4.0.1'
            migrations: '3.9.7'
            postgresql: '18'
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: candidate_consumer
          POSTGRES_USER: candidate_consumer
          POSTGRES_PASSWORD: candidate_consumer
        options: >-
          --health-cmd "pg_isready -U candidate_consumer -d candidate_consumer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: /tmp/candidate-consumer
    env:
      DATABASE_URL: postgresql://candidate_consumer:candidate_consumer@127.0.0.1:5432/candidate_consumer?serverVersion=${{ matrix.postgresql }}
      TENANT_DATABASE_A_URL: postgresql://candidate_consumer:candidate_consumer@127.0.0.1:5432/candidate_consumer_tenant_a?serverVersion=${{ matrix.postgresql }}
      TENANT_DATABASE_B_URL: postgresql://candidate_consumer:candidate_consumer@127.0.0.1:5432/candidate_consumer_tenant_b?serverVersion=${{ matrix.postgresql }}
      DATABASE_STRATEGY: shared_db
      EXPECTED_CANDIDATE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql
          coverage: none

      - name: Build the distribution-equivalent candidate archive
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/candidate-dist /tmp/candidate-consumer
          git archive --format=zip --prefix=zhortein-multi-tenant-bundle-candidate/ --output=/tmp/candidate-dist/zhortein-multi-tenant-bundle-candidate.zip "$GITHUB_SHA"
          sha256sum /tmp/candidate-dist/zhortein-multi-tenant-bundle-candidate.zip
          if unzip -Z1 /tmp/candidate-dist/zhortein-multi-tenant-bundle-candidate.zip \
            | grep -Ev '(^|/)tests/ConsumerApp/var/cache/?$|(^|/)tests/ConsumerApp/var/cache/\.gitkeep$' \
            | grep -Eq '(^|/)(vendor|var/cache|\.git)/'; then
            echo 'The candidate archive contains a forbidden generated directory.' >&2
            exit 1
          fi
          unzip -Z1 /tmp/candidate-dist/zhortein-multi-tenant-bundle-candidate.zip | grep -F 'src/Command/MigrateTenantsCommand.php'

      - name: Prepare a fresh consumer with only the candidate archive repository
        working-directory: ${{ github.workspace }}
        run: |
          cp -R tests/ConsumerApp/. /tmp/candidate-consumer/
          repository_definition="$(php tests/create-candidate-package-repository.php /tmp/candidate-dist/zhortein-multi-tenant-bundle-candidate.zip "$GITHUB_SHA")"
          composer --working-dir=/tmp/candidate-consumer config --json repositories.candidate "$repository_definition"
          composer --working-dir=/tmp/candidate-consumer require --no-update "zhortein/multi-tenant-bundle:dev-candidate"

      - name: Select the candidate compatibility graph
        run: |
          composer require --no-update \
            "symfony/cache:${{ matrix.symfony }}" \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/console:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/doctrine-messenger:${{ matrix.symfony }}" \
            "symfony/event-dispatcher:${{ matrix.symfony }}" \
            "symfony/filesystem:${{ matrix.symfony }}" \
            "symfony/finder:${{ matrix.symfony }}" \
            "symfony/framework-bundle:${{ matrix.symfony }}" \
            "symfony/http-foundation:${{ matrix.symfony }}" \
            "symfony/http-kernel:${{ matrix.symfony }}" \
            "symfony/mailer:${{ matrix.symfony }}" \
            "symfony/messenger:${{ matrix.symfony }}" \
            "symfony/scheduler:${{ matrix.symfony }}" \
            "symfony/validator:${{ matrix.symfony }}" \
            "doctrine/orm:${{ matrix.orm }}" \
            "doctrine/dbal:${{ matrix.dbal }}" \
            "doctrine/doctrine-bundle:${{ matrix.doctrine_bundle }}" \
            "doctrine/doctrine-migrations-bundle:${{ matrix.migrations_bundle }}" \
            "doctrine/migrations:${{ matrix.migrations }}"
          composer require --dev --no-update "symfony/security-bundle:${{ matrix.symfony }}"

      - name: Install the bundle exclusively from the candidate ZIP
        run: composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

      - name: Verify candidate version, commit, and installed bytes
        run: |
          php bin/assert-candidate-package.php
          php bin/assert-migration-graph.php "${{ matrix.migrations_bundle }}" "${{ matrix.migrations }}" "${{ matrix.dbal }}"
          cmp "${GITHUB_WORKSPACE}/src/Command/MigrateTenantsCommand.php" vendor/zhortein/multi-tenant-bundle/src/Command/MigrateTenantsCommand.php
          composer show zhortein/multi-tenant-bundle

      - name: Compile a production kernel from the candidate archive
        run: |
          APP_ENV=prod APP_DEBUG=0 php bin/console cache:clear --no-warmup
          APP_ENV=prod APP_DEBUG=0 php bin/console cache:warmup
          APP_ENV=prod APP_DEBUG=0 php bin/console lint:container

      - name: Prove candidate Scheduler persistent redispatch
        run: vendor/bin/phpunit --no-coverage --filter 'AllMessengerBusesProtectedTest|SchedulerRedispatchTest'

      - name: Exercise candidate tenant:migrate against PostgreSQL
        run: sh bin/test-tenant-migrate.sh

  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PHP 8.3 / Symfony 7.4 / ORM 3.5 / DBAL 3.8 lowest
            php: '8.3'
            symfony: '~7.4.0'
            orm: '~3.5.0'
            dbal: '^3.8'
            doctrine_bundle: ^2.19
            dependencies: lowest
          - name: PHP 8.3 / Symfony 7.4 / ORM 3.6 / DBAL 4.4
            php: '8.3'
            symfony: '~7.4.0'
            orm: '^3.6'
            dbal: '^4.4'
            doctrine_bundle: ^2.19
            dependencies: highest
          - name: PHP 8.4 / Symfony 7.4 / ORM 3.6 / DBAL 4.4
            php: '8.4'
            symfony: '~7.4.0'
            orm: '^3.6'
            dbal: '^4.4'
            doctrine_bundle: ^3.3
            dependencies: highest
          - name: PHP 8.4 / Symfony 8.0 / ORM 3.6 / DBAL 4.4
            php: '8.4'
            symfony: '~8.0.0'
            orm: '^3.6'
            dbal: '^4.4'
            doctrine_bundle: ^3.3
            dependencies: highest
          - name: PHP 8.5 / Symfony 7.4 / ORM 3.6 / DBAL 4.4
            php: '8.5'
            symfony: '~7.4.0'
            orm: '^3.6'
            dbal: '^4.4'
            doctrine_bundle: ^3.3
            dependencies: highest
          - name: PHP 8.5 / Symfony 8.0 / ORM 3.6 / DBAL 4.4
            php: '8.5'
            symfony: '~8.0.0'
            orm: '^3.6'
            dbal: '^4.4'
            doctrine_bundle: ^3.3
            dependencies: highest
          - name: PHP 8.5 / Symfony 8.1 / ORM 3.6 / DBAL 4.4
            php: '8.5.9'
            symfony: '~8.1.0'
            orm: '^3.6'
            dbal: '^4.4'
            doctrine_bundle: ^3.3
            dependencies: highest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: multi_tenant_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U test_user -d multi_tenant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_NAME: multi_tenant_test
      TEST_DATABASE_USER: test_user
      TEST_DATABASE_PASSWORD: test_password
      TEST_DATABASE_APP_USER: rls_test_app
      TEST_DATABASE_APP_PASSWORD: rls_test_password
      TEST_DATABASE_REQUIRED: 1
      TEST_DATABASE_SERVER_VERSION: '18'
      TEST_KERNEL_DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/multi_tenant_kernel_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, intl, json, mbstring
          coverage: none

      - name: Select supported dependency combination
        run: |
          composer require --no-update \
            "doctrine/doctrine-bundle:${{ matrix.doctrine_bundle }}" \
            "doctrine/orm:${{ matrix.orm }}" \
            "doctrine/dbal:${{ matrix.dbal }}" \
            "symfony/cache:${{ matrix.symfony }}" \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/console:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/doctrine-messenger:${{ matrix.symfony }}" \
            "symfony/event-dispatcher:${{ matrix.symfony }}" \
            "symfony/filesystem:${{ matrix.symfony }}" \
            "symfony/finder:${{ matrix.symfony }}" \
            "symfony/http-foundation:${{ matrix.symfony }}" \
            "symfony/http-kernel:${{ matrix.symfony }}" \
            "symfony/messenger:${{ matrix.symfony }}" \
            "symfony/scheduler:${{ matrix.symfony }}" \
            "symfony/validator:${{ matrix.symfony }}"
          composer require --dev --no-update \
            "symfony/framework-bundle:${{ matrix.symfony }}"

      - name: Resolve dependencies
        run: |
          options=(--prefer-dist --no-progress --no-interaction --with-all-dependencies)
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            options+=(--prefer-lowest)
          fi
          composer update "${options[@]}"

      - name: Update static analysis tooling for the lowest runtime
        if: matrix.dependencies == 'lowest'
        run: >-
          composer update --prefer-dist --no-progress --no-interaction
          phpstan/phpstan phpstan/phpstan-doctrine phpstan/phpstan-symfony

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --no-interaction --abandoned=report

      - name: Run PHPStan at maximum level
        run: vendor/bin/phpstan analyse src -c phpstan.neon --memory-limit=512M

      - name: Provision isolated functional databases
        run: PGPASSWORD="$TEST_DATABASE_PASSWORD" psql -h "$TEST_DATABASE_HOST" -p "$TEST_DATABASE_PORT" -U "$TEST_DATABASE_USER" -d "$TEST_DATABASE_NAME" -f tests/sql/provision-databases.sql

      - name: Run PHPUnit outside the dedicated RLS group
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --exclude-group rls --no-coverage

      - name: Run PostgreSQL RLS tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --group rls --no-coverage
