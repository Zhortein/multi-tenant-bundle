name: Compatibility

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  postgresql:
    name: PostgreSQL ${{ matrix.postgresql }} / required security recipes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: multi_tenant_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U test_user -d multi_tenant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_NAME: multi_tenant_test
      TEST_DATABASE_USER: test_user
      TEST_DATABASE_PASSWORD: test_password
      TEST_DATABASE_APP_USER: rls_test_app
      TEST_DATABASE_APP_PASSWORD: rls_test_password
      TEST_DATABASE_REQUIRED: 1
      TEST_DATABASE_SERVER_VERSION: ${{ matrix.postgresql }}
      TEST_KERNEL_DATABASE_URL: postgresql://test_user:test_password@127.0.0.1:5432/multi_tenant_kernel_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.9'
          extensions: pdo_pgsql
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Provision isolated functional databases
        run: PGPASSWORD="$TEST_DATABASE_PASSWORD" psql -h "$TEST_DATABASE_HOST" -p "$TEST_DATABASE_PORT" -U "$TEST_DATABASE_USER" -d "$TEST_DATABASE_NAME" -f tests/sql/provision-databases.sql

      - name: Run shared-database, CLI, HTTP, and Messenger recipes on PostgreSQL
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --exclude-group rls --no-coverage

      - name: Run RLS and multi-database recipes on PostgreSQL
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --group rls --no-coverage

  quality:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Validate documentation
        run: php tests/validate-documentation.php

      - name: Check coding style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  minimal-install:
    name: Minimal production install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Resolve production dependencies only
        run: composer update --no-dev --prefer-dist --no-progress --no-interaction

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit production dependencies
        run: composer audit --no-interaction --abandoned=report

      - name: Compile without optional integrations
        run: php tests/minimal-install.php

  consumer-application:
    name: Consumer / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Symfony 7.4
            php: "8.3"
            symfony: "~7.4.0"
          - name: Symfony 8.0
            php: "8.4"
            symfony: "~8.0.0"
          - name: Symfony 8.1
            php: "8.5.9"
            symfony: "~8.1.0"
    defaults:
      run:
        working-directory: /tmp/consumer
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare external consumer directory
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "/tmp/consumer"
          cp -R tests/ConsumerApp/. "/tmp/consumer/"
          composer --working-dir="/tmp/consumer" config --json repositories.bundle "{\"type\":\"path\",\"url\":\"${GITHUB_WORKSPACE}\",\"options\":{\"symlink\":false}}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Select the Symfony branch
        run: >-
          composer require --no-update
          "symfony/config:${{ matrix.symfony }}"
          "symfony/console:${{ matrix.symfony }}"
          "symfony/dependency-injection:${{ matrix.symfony }}"
          "symfony/event-dispatcher:${{ matrix.symfony }}"
          "symfony/filesystem:${{ matrix.symfony }}"
          "symfony/finder:${{ matrix.symfony }}"
          "symfony/framework-bundle:${{ matrix.symfony }}"
          "symfony/http-foundation:${{ matrix.symfony }}"
          "symfony/http-kernel:${{ matrix.symfony }}"
          "symfony/mailer:${{ matrix.symfony }}"
          "symfony/messenger:${{ matrix.symfony }}"

      - name: Select compatible test dependencies
        run: >-
          composer require --dev --no-update
          "phpunit/phpunit:^12.2"
          "symfony/browser-kit:${{ matrix.symfony }}"
          "symfony/dom-crawler:${{ matrix.symfony }}"

      - name: Install the bundle as an external dependency
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Validate shared database container
        run: php bin/validate.php
        env:
          DATABASE_STRATEGY: shared_db

      - name: Validate public test kit with shared database strategy
        run: vendor/bin/phpunit --no-coverage
        env:
          DATABASE_STRATEGY: shared_db

      - name: Validate multi-database container
        run: php bin/validate.php
        env:
          DATABASE_STRATEGY: multi_db

      - name: Validate public test kit with multi-database strategy
        run: vendor/bin/phpunit --no-coverage
        env:
          DATABASE_STRATEGY: multi_db

  doctrine-migrations-3:
    name: Doctrine Migrations Bundle ${{ matrix.migrations_bundle }} / consumer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        migrations_bundle: ['3.4.0', '3.7.0']
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: consumer
          POSTGRES_USER: consumer
          POSTGRES_PASSWORD: consumer
        options: >-
          --health-cmd "pg_isready -U consumer -d consumer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: /tmp/consumer
    env:
      DATABASE_URL: postgresql://consumer:consumer@127.0.0.1:5432/consumer?serverVersion=18.6
      DATABASE_STRATEGY: shared_db
      EXACT_CONSUMER: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare external consumer directory
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/consumer
          cp -R tests/ConsumerApp/. /tmp/consumer/
          composer --working-dir=/tmp/consumer config --json repositories.bundle "{\"type\":\"path\",\"url\":\"${GITHUB_WORKSPACE}\",\"options\":{\"symlink\":false}}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql
          coverage: none

      - name: Select Doctrine Migrations Bundle 3 compatibility graph
        run: >-
          composer require --no-update
          "symfony/framework-bundle:7.4.15"
          "doctrine/orm:3.6.8"
          "doctrine/dbal:4.4.4"
          "doctrine/doctrine-bundle:2.19.0"
          "doctrine/doctrine-migrations-bundle:${{ matrix.migrations_bundle }}"

      - name: Install the checkout as an external dependency
        run: composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

      - name: Validate container and Doctrine metadata
        run: |
          php bin/validate.php
          php bin/console doctrine:schema:validate --skip-sync

      - name: Exercise migration up, down, and up
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:migrations:execute --down 'DoctrineMigrations\Version20260831000000' --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run consumer tests
        run: vendor/bin/phpunit --no-coverage

  services-locaux-consumer:
    name: Consumer / Services Locaux exact graph
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: consumer
          POSTGRES_USER: consumer
          POSTGRES_PASSWORD: consumer
        options: >-
          --health-cmd "pg_isready -U consumer -d consumer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: /tmp/consumer
    env:
      DATABASE_URL: postgresql://consumer:consumer@127.0.0.1:5432/consumer?serverVersion=18.6
      DATABASE_STRATEGY: shared_db
      EXACT_CONSUMER: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare external consumer directory
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/consumer
          cp -R tests/ConsumerApp/. /tmp/consumer/
          composer --working-dir=/tmp/consumer config --json repositories.bundle "{\"type\":\"path\",\"url\":\"${GITHUB_WORKSPACE}\",\"options\":{\"symlink\":false}}"
          composer --working-dir=/tmp/consumer config platform.php 8.5.9

      - name: Build the exact PHP 8.5.9 consumer runtime
        working-directory: ${{ github.workspace }}
        run: docker build --tag services-locaux-consumer --file tests/ConsumerApp/Dockerfile tests/ConsumerApp

      - name: Select the exact root dependency graph
        run: >-
          docker run --rm --volume /tmp/consumer:/consumer services-locaux-consumer
          composer require --no-update
          "php:8.5.9"
          "symfony/config:8.1.5"
          "symfony/console:8.1.5"
          "symfony/dependency-injection:8.1.5"
          "symfony/event-dispatcher:8.1.5"
          "symfony/filesystem:8.1.5"
          "symfony/finder:8.1.5"
          "symfony/framework-bundle:8.1.5"
          "symfony/http-foundation:8.1.5"
          "symfony/http-kernel:8.1.5"
          "symfony/mailer:8.1.5"
          "symfony/messenger:8.1.5"
          "doctrine/orm:3.6.8"
          "doctrine/dbal:4.4.4"
          "doctrine/doctrine-bundle:3.3.1"
          "doctrine/doctrine-migrations-bundle:4.0.1"

      - name: Install the checkout as an external dependency
        run: >-
          docker run --rm --volume /tmp/consumer:/consumer
          --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}:ro"
          services-locaux-consumer
          composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

      - name: Assert exact installed versions
        run: docker run --rm --volume /tmp/consumer:/consumer services-locaux-consumer php bin/assert-exact-versions.php

      - name: Validate container and Doctrine metadata
        run: |
          docker run --rm --network host --volume /tmp/consumer:/consumer --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer php bin/validate.php
          docker run --rm --network host --volume /tmp/consumer:/consumer --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer php bin/console doctrine:schema:validate --skip-sync

      - name: Exercise migration up, down, and up
        run: |
          docker run --rm --network host --volume /tmp/consumer:/consumer --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer php bin/console doctrine:migrations:migrate --no-interaction
          docker run --rm --network host --volume /tmp/consumer:/consumer --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer php bin/console doctrine:migrations:execute --down 'DoctrineMigrations\Version20260831000000' --no-interaction
          docker run --rm --network host --volume /tmp/consumer:/consumer --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer php bin/console doctrine:migrations:migrate --no-interaction

      - name: Prove fail-closed consumer boundaries
        run: >-
          docker run --rm --network host --volume /tmp/consumer:/consumer
          --env DATABASE_URL --env DATABASE_STRATEGY --env EXACT_CONSUMER services-locaux-consumer
          php vendor/bin/phpunit --no-coverage --filter ServicesLocauxCompatibilityTest

  compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PHP 8.3 / Symfony 7.4 / ORM 3.5 / DBAL 3.8 lowest
            php: '8.3'
            symfony: '~7.4.0'
            orm: '~3.5.0'
            dbal: '^3.8'
            doctrine_bundle: ^2.19
            dependencies: lowest
          - name: PHP 8.3 / Symfony 7.4 / ORM 3.6 / DBAL 4.4
            php: '8.3'
            symfony: '~7.4.0'
            orm: '^3.6'
            dbal: '^4.4'
            doctrine_bundle: ^2.19
            dependencies: highest
          - name: PHP 8.4 / Symfony 7.4 / ORM 3.6 / DBAL 4.4
            php: '8.4'
            symfony: '~7.4.0'
            orm: '^3.6'
            dbal: '^4.4'
            doctrine_bundle: ^3.3
            dependencies: highest
          - name: PHP 8.4 / Symfony 8.0 / ORM 3.6 / DBAL 4.4
            php: '8.4'
            symfony: '~8.0.0'
            orm: '^3.6'
            dbal: '^4.4'
            doctrine_bundle: ^3.3
            dependencies: highest
          - name: PHP 8.5 / Symfony 7.4 / ORM 3.6 / DBAL 4.4
            php: '8.5'
            symfony: '~7.4.0'
            orm: '^3.6'
            dbal: '^4.4'
            doctrine_bundle: ^3.3
            dependencies: highest
          - name: PHP 8.5 / Symfony 8.0 / ORM 3.6 / DBAL 4.4
            php: '8.5'
            symfony: '~8.0.0'
            orm: '^3.6'
            dbal: '^4.4'
            doctrine_bundle: ^3.3
            dependencies: highest
          - name: PHP 8.5 / Symfony 8.1 / ORM 3.6 / DBAL 4.4
            php: '8.5.9'
            symfony: '~8.1.0'
            orm: '^3.6'
            dbal: '^4.4'
            doctrine_bundle: ^3.3
            dependencies: highest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: multi_tenant_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U test_user -d multi_tenant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      TEST_DATABASE_HOST: 127.0.0.1
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_NAME: multi_tenant_test
      TEST_DATABASE_USER: test_user
      TEST_DATABASE_PASSWORD: test_password
      TEST_DATABASE_APP_USER: rls_test_app
      TEST_DATABASE_APP_PASSWORD: rls_test_password
      TEST_DATABASE_REQUIRED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, intl, json, mbstring
          coverage: none

      - name: Select supported dependency combination
        run: |
          composer require --no-update \
            "doctrine/doctrine-bundle:${{ matrix.doctrine_bundle }}" \
            "doctrine/orm:${{ matrix.orm }}" \
            "doctrine/dbal:${{ matrix.dbal }}" \
            "symfony/config:${{ matrix.symfony }}" \
            "symfony/console:${{ matrix.symfony }}" \
            "symfony/dependency-injection:${{ matrix.symfony }}" \
            "symfony/event-dispatcher:${{ matrix.symfony }}" \
            "symfony/filesystem:${{ matrix.symfony }}" \
            "symfony/finder:${{ matrix.symfony }}" \
            "symfony/http-foundation:${{ matrix.symfony }}" \
            "symfony/http-kernel:${{ matrix.symfony }}" \
            "symfony/messenger:${{ matrix.symfony }}"
          composer require --dev --no-update \
            "symfony/framework-bundle:${{ matrix.symfony }}"

      - name: Resolve dependencies
        run: |
          options=(--prefer-dist --no-progress --no-interaction --with-all-dependencies)
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            options+=(--prefer-lowest)
          fi
          composer update "${options[@]}"

      - name: Update static analysis tooling for the lowest runtime
        if: matrix.dependencies == 'lowest'
        run: >-
          composer update --prefer-dist --no-progress --no-interaction
          phpstan/phpstan phpstan/phpstan-doctrine phpstan/phpstan-symfony

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit dependencies
        run: composer audit --no-interaction --abandoned=report

      - name: Run PHPStan at maximum level
        run: vendor/bin/phpstan analyse src -c phpstan.neon --memory-limit=512M

      - name: Provision isolated functional databases
        run: PGPASSWORD="$TEST_DATABASE_PASSWORD" psql -h "$TEST_DATABASE_HOST" -p "$TEST_DATABASE_PORT" -U "$TEST_DATABASE_USER" -d "$TEST_DATABASE_NAME" -f tests/sql/provision-databases.sql

      - name: Run PHPUnit outside the dedicated RLS group
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --exclude-group rls --no-coverage

      - name: Run PostgreSQL RLS tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --group rls --no-coverage
