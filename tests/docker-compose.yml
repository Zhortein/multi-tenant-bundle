services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_DB: multi_tenant_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d multi_tenant_test"]
      interval: 10s
      timeout: 5s
      retries: 5


  php-rls:
    build:
      context: ..
      dockerfile: tests/Dockerfile.rls
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      TEST_DATABASE_HOST: postgres
      TEST_DATABASE_PORT: 5432
      TEST_DATABASE_NAME: multi_tenant_test
      TEST_DATABASE_USER: test_user
      TEST_DATABASE_PASSWORD: test_password
      TEST_DATABASE_REQUIRED: 1
      TEST_DATABASE_SERVER_VERSION: ${POSTGRES_VERSION:-18}
      TEST_KERNEL_DATABASE_URL: postgresql://test_user:test_password@postgres:5432/multi_tenant_kernel_test
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
